<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071b3b">
    <title>AI Engineering Fundamentals — Eduardo Niglio</title>
    <style>
      :root { color-scheme: dark; background: #071b3b; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #071b3b;
      }
      img {
        display: block;
        width: auto;
        height: auto;
        max-width: min(100%, 32rem);
        max-height: calc(100vh - 2rem);
        max-height: calc(100dvh - 2rem);
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./capa-ai-engineering-fundamentals.png" alt="Capa do livro AI Engineering Fundamentals, de Eduardo Niglio">
    </main>
  </body>
</html>
